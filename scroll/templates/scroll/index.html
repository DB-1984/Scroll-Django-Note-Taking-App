{% extends "scroll/base.html" %}

{% block content %}
<div class="py-3 text-center text-[15px] font-semibold border-b border-black/10">Feed</div>

{% if user.is_authenticated %}
<div class="composer flex gap-3 px-4 sm:px-6 py-4 border-b border-black/10">
    <div class="size-9 rounded-full bg-black flex-shrink-0 flex items-center justify-center text-xs font-semibold text-white">
        {{ user.username|slice:":1"|upper }}
    </div>
    <form hx-post="{% url 'index' %}" hx-target="#timeline" hx-swap="afterbegin"
        hx-on::after-request="this.reset()" class="flex-grow min-w-0">
        {% csrf_token %}
        <div class="text-[15px] font-semibold leading-tight mb-1">{{ user.username }}</div>

        <div class="min-h-[56px]">
            {{ entry_form.body }}
        </div>

        <div class="flex justify-between items-center gap-3 mt-3">
            <div class="flex items-center gap-2 min-w-0">
                {{ entry_form.label_name }}
            </div>
            <button type="submit"
                class="bg-black text-sm text-white font-semibold px-5 py-1.5 rounded-full hover:bg-black/80 active:scale-95 transition">
                Post
            </button>
        </div>
    </form>
</div>
{% endif %}

<div id="timeline" class="divide-y divide-black/10">
    {% include 'scroll/partials/entry_list_partial.html' %}
</div>
{% endblock %}

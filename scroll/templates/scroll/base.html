{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Composer + edit form fields: borderless, like Threads' "What's new?" box */
    .composer textarea,
    .composer input[type="text"] {
      width: 100%;
      background: transparent;
      color: #000;
      border: 0;
      outline: none;
      box-shadow: none;
      padding: 0;
      resize: none;
      font-size: 15px;
      line-height: 1.5;
    }

    .composer select {
      background: #f3f5f7;
      color: #555;
      border: 1px solid #e5e5e5;
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 13px;
      outline: none;
    }

    .composer textarea::placeholder,
    .composer input::placeholder {
      color: #999;
    }

    .composer select:focus {
      border-color: #999;
    }
  </style>
</head>

<body class="min-h-screen bg-[#f3f5f7] text-black antialiased selection:bg-black selection:text-white"
  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

  <!-- Desktop icon rail -->
  <aside class="hidden lg:flex fixed inset-y-0 left-0 w-20 flex-col items-center py-6 z-30">
    <a href="{% url 'index' %}" class="inline-flex items-center gap-1 px-5 text-black text-2xl font-bold tracking-tight">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="14 45 341 281" fill="currentColor" class="h-[.5em] w-auto" aria-hidden="true">
        <path fill-rule="evenodd" d="M14 157V104A58 58 0 0 1 72 46H235A58 58 0 0 1 293 104V217H138V284A42 42 0 0 1 96 326H84V157ZM44 126V100A23 23 0 0 1 67 77H84V126Z" />
        <path d="M168 246H355V276A50 50 0 0 1 305 326H155C164 305 168 280 168 246Z" />
      </svg>
      <span><p class="tracking-tight font-black text-sm">Scroll</p></span>
    </a>

    <nav class="flex-grow flex flex-col items-center justify-center gap-2">
      <a href="{% url 'index' %}" title="Feed"
        class="p-4 rounded-xl hover:bg-black/5 transition-colors {% if request.resolver_match.url_name == 'index' %}text-black{% else %}text-[#b0b0b0]{% endif %}">
        <svg class="size-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
      </a>
      <a href="{% url 'labels' %}" title="Labels"
        class="p-4 rounded-xl hover:bg-black/5 transition-colors {% if request.resolver_match.url_name == 'labels' %}text-black{% else %}text-[#b0b0b0]{% endif %}">
        <svg class="size-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path
            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
        </svg>
      </a>
    </nav>

    <div class="flex flex-col items-center gap-3">
      {% if user.is_authenticated %}
      {% if user.socialaccount_set.all.0 %}
      <img src="{{ user.socialaccount_set.all.0.get_avatar_url }}" alt="{{ user.username }}" title="{{ user.username }}"
        class="size-8 rounded-full">
      {% else %}
      <div title="{{ user.username }}"
        class="size-8 rounded-full bg-black flex items-center justify-center text-xs font-semibold text-white">
        {{ user.username|slice:":1"|upper }}
      </div>
      {% endif %}
      <form action="{% url 'account_logout' %}" method="post" class="m-0">
        {% csrf_token %}
        <button type="submit" title="Log out"
          class="p-3 rounded-xl text-[#b0b0b0] hover:bg-black/5 hover:text-black transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" x2="9" y1="12" y2="12" />
          </svg>
        </button>
      </form>
      {% endif %}
    </div>
  </aside>

  <!-- Mobile top bar -->
  <header class="lg:hidden sticky top-0 z-30 flex items-center justify-center bg-[#f3f5f7]/90 backdrop-blur-md py-3">
    <a href="{% url 'index' %}" class="inline-flex items-center gap-1 px-5 text-black text-2xl font-bold tracking-tight">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="14 45 341 281" fill="currentColor" class="h-[.5em] w-auto" aria-hidden="true">
        <path fill-rule="evenodd" d="M14 157V104A58 58 0 0 1 72 46H235A58 58 0 0 1 293 104V217H138V284A42 42 0 0 1 96 326H84V157ZM44 126V100A23 23 0 0 1 67 77H84V126Z" />
        <path d="M168 246H355V276A50 50 0 0 1 305 326H155C164 305 168 280 168 246Z" />
      </svg>
      <span><p class="tracking-tight font-black text-base">Scroll</p></span>
    </a>
  </header>

  <main class="lg:pl-20 pb-20 lg:pb-12">
    <div class="mx-auto flex max-w-[960px] justify-center gap-6 lg:px-6 lg:pt-4">

      <div class="min-w-0 w-full max-w-[640px]">
        <!-- Search -->
        <div class="relative px-4 lg:px-0 mb-3">
          <div class="absolute inset-y-0 left-8 lg:left-4 flex items-center pointer-events-none text-[#999]">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </div>
          <input type="text" name="q" placeholder="Search" hx-get="{% url 'index' %}"
            hx-trigger="keyup changed delay:300ms" hx-target="#timeline"
            class="w-full rounded-full bg-white border border-black/5 pl-10 pr-4 py-2.5 text-sm text-black outline-none placeholder:text-[#999] focus:border-black/20 transition-colors" />
        </div>

        <!-- Feed card -->
        <div id="entry-stream" class="bg-white lg:rounded-3xl border-y lg:border border-black/10 overflow-hidden">
          {% block content %}{% endblock %}
        </div>
      </div>

      <!-- Side modules (large screens only) -->
      <aside class="hidden xl:flex w-[260px] shrink-0 flex-col gap-4 sticky top-4 self-start">
        <div id="weather-module" hx-trigger="location-ready" class="w-full transition-opacity duration-300">
          <div class="animate-pulse bg-white border border-black/10 rounded-2xl h-24"></div>
        </div>

        <div id="quote-module" hx-get="{% url 'get_quote' %}" hx-trigger="load"
          class="bg-white border border-black/10 p-5 rounded-2xl flex flex-col justify-center min-h-[120px]">
          <div class="animate-pulse h-4 w-3/4 bg-black/10 rounded"></div>
        </div>
      </aside>

    </div>
  </main>

  <!-- Mobile bottom nav -->
  <nav
    class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-black/10 flex items-center justify-around py-2">
    <a href="{% url 'index' %}" aria-label="Feed"
      class="p-3 {% if request.resolver_match.url_name == 'index' %}text-black{% else %}text-[#b0b0b0]{% endif %}">
      <svg class="size-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>
    <a href="{% url 'labels' %}" aria-label="Labels"
      class="p-3 {% if request.resolver_match.url_name == 'labels' %}text-black{% else %}text-[#b0b0b0]{% endif %}">
      <svg class="size-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path
          d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
      </svg>
    </a>
    {% if user.is_authenticated %}
    <form action="{% url 'account_logout' %}" method="post" class="m-0">
      {% csrf_token %}
      <button type="submit" aria-label="Log out" class="p-3 text-[#b0b0b0]">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" x2="9" y1="12" y2="12" />
        </svg>
      </button>
    </form>
    {% endif %}
  </nav>

  <script>
    document.body.addEventListener('htmx:afterOnLoad', function (evt) {
        if (
            evt.detail.xhr.status === 200 &&
            (
                evt.detail.target.id === 'entry-stream' ||
                evt.detail.target.id === 'entry-form-container'
            )
        ) {
            const form = document.getElementById('entry-form');
            if (form) form.reset();
        }
    });

    function copyShareLink(url) {
        const fullUrl = window.location.origin + url;
        const btn = window.event ? window.event.currentTarget : null;

        navigator.clipboard.writeText(fullUrl).then(() => {
            if (!btn) return;

            const originalColor = btn.style.color;
            btn.style.color = '#000000';

            setTimeout(() => {
                btn.style.color = originalColor;
            }, 1000);
        });
    }

    function interpretWeatherCode(code) {
        if (code === 0) return 'Clear';
        if (code === 1) return 'Mainly clear';
        if (code === 2) return 'Partly cloudy';
        if (code === 3) return 'Overcast';
        if ([45, 48].includes(code)) return 'Fog';
        if ([51, 53, 55].includes(code)) return 'Drizzle';
        if ([56, 57].includes(code)) return 'Freezing drizzle';
        if ([61, 63, 65].includes(code)) return 'Rain';
        if ([66, 67].includes(code)) return 'Freezing rain';
        if ([71, 73, 75].includes(code)) return 'Snow';
        if (code === 77) return 'Snow grains';
        if ([80, 81, 82].includes(code)) return 'Rain showers';
        if ([85, 86].includes(code)) return 'Snow showers';
        if ([95, 96, 99].includes(code)) return 'Thunderstorm';
        return 'Unknown';
    }

    function getWeatherLocation() {
        const fallback = {
            lat: 52.06,
            lon: -1.33,
            isLocal: false
        };

        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(fallback);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve({
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                        isLocal: true
                    });
                },
                () => resolve(fallback),
                {
                    timeout: 5000,
                    maximumAge: 600000,
                    enableHighAccuracy: false
                }
            );
        });
    }

    async function initialiseWeather() {
        const widget = document.getElementById('weather-widget');

        if (!widget || widget.dataset.initialised) return;
        widget.dataset.initialised = 'true';

        const locationLabel = widget.querySelector('#weather-location');
        const temperature = widget.querySelector('#weather-temp');
        const conditionLabel = widget.querySelector('#weather-condition');

        const location = await getWeatherLocation();

        locationLabel.textContent = location.isLocal
            ? 'Local weather'
            : 'Banbury weather';

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);

        try {
            const params = new URLSearchParams({
                latitude: location.lat,
                longitude: location.lon,
                current: 'temperature_2m,weather_code'
            });

            const response = await fetch(
                `https://api.open-meteo.com/v1/forecast?${params}`,
                { signal: controller.signal }
            );

            if (!response.ok) {
                throw new Error(`Weather API returned ${response.status}`);
            }

            const data = await response.json();
            const current = data.current;

            if (
                !current ||
                typeof current.temperature_2m !== 'number' ||
                typeof current.weather_code !== 'number'
            ) {
                throw new Error('Weather API returned unexpected data');
            }

            const temp = Math.round(current.temperature_2m);
            const condition = interpretWeatherCode(current.weather_code);

            temperature.textContent = `${temp}°C`;
            conditionLabel.textContent = condition;

            widget.classList.remove(
                'bg-white',
                'bg-[#fff4e5]',
                'bg-[#eaf6f4]',
                'bg-[#eef6ff]'
            );

            let background = 'bg-white';

            if (temp > 25) {
                background = 'bg-[#fff4e5]';
            } else if (/rain|drizzle|showers/i.test(condition)) {
                background = 'bg-[#eaf6f4]';
            } else if (temp < 8) {
                background = 'bg-[#eef6ff]';
            }

            widget.classList.add(background);
        } catch (error) {
            console.error('Weather lookup failed:', error);
            temperature.textContent = '--';
            conditionLabel.textContent = 'Weather unavailable';
        } finally {
            clearTimeout(timeout);
        }
    }

    document.addEventListener('htmx:afterSwap', initialiseWeather);

    document.addEventListener('DOMContentLoaded', function () {
        const weatherModule = document.getElementById('weather-module');

        if (weatherModule && !document.getElementById('weather-widget')) {
            weatherModule.setAttribute('hx-get', "{% url 'get_weather' %}");
            htmx.process(weatherModule);
            htmx.trigger(weatherModule, 'location-ready');
        }

        initialiseWeather();
    });
</script>
  
</body>

</html>

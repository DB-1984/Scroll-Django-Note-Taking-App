<div id="entry-{{ entry.id }}" class="px-4 sm:px-6 py-4 border-b border-black/10 bg-[#fafafa]">
    <form hx-post="{% url 'edit_entry' entry.pk %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML"
        class="composer">
        {% csrf_token %}

        <textarea name="body" rows="3" required>{{ entry.body }}</textarea>

        <div class="flex items-center gap-2 mt-3">
            <span class="text-[13px] text-[#999]">Label</span>
            <div class="flex-1">
                {{ entry_form.label_name }}
            </div>
        </div>

        <div class="flex justify-end items-center gap-3 mt-4">
            <button type="button" hx-get="{% url 'get_entry' entry.pk %}" hx-target="#entry-{{ entry.id }}"
                hx-swap="outerHTML" class="text-sm font-medium text-[#999] hover:text-black transition-colors">
                Cancel
            </button>
            <button type="submit"
                class="bg-black text-sm text-white font-semibold px-5 py-1.5 rounded-full hover:bg-black/80 active:scale-95 transition">
                Save
            </button>
        </div>
    </form>
</div>

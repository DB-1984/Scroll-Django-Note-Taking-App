<li id="entry-{{ entry.id }}" class="border-b border-line py-7 first:pt-0">
  <form hx-post="{% url 'edit_entry' entry.pk %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML"
    class="composer rounded-[28px] border border-ink p-6">
    {% csrf_token %}
    <textarea name="body" rows="3" required aria-label="Entry text">{{ entry.body }}</textarea>

    <div class="mt-4 flex flex-wrap items-center gap-3">
      <span class="lb text-muted">Label</span>
      <div class="min-w-0 flex-1">{{ entry_form.label_name }}</div>
    </div>

    <div class="mt-5 flex items-center justify-end gap-3">
      <button type="button" hx-get="{% url 'get_entry' entry.pk %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML"
        class="btn-o">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</li>

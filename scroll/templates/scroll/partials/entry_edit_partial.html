<li id="entry-{{ entry.id }}" class="relative flex gap-5 pb-[22px]">
  <span aria-hidden="true" class="node mt-[14px] size-[15px] flex-none rounded-full border border-ink bg-paper"></span>

  <article class="min-w-0 flex-1 border border-ink bg-bar px-4 py-3.5">
    <form hx-post="{% url 'edit_entry' entry.pk %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML" class="composer">
      {% csrf_token %}
      <textarea name="body" rows="3" required aria-label="Entry text">{{ entry.body }}</textarea>

      <div class="mt-3 flex items-center gap-2">
        <span class="lb text-muted">Label</span>
        <div class="flex-1">{{ entry_form.label_name }}</div>
      </div>

      <div class="mt-4 flex items-center justify-end gap-3">
        <button type="button" hx-get="{% url 'get_entry' entry.pk %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML"
          class="lb text-muted hover:text-ink">Cancel</button>
        <button type="submit" class="chip lb" style="padding:7px 18px">Save</button>
      </div>
    </form>
  </article>
</li>

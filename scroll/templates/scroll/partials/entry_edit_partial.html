<div id="entry-{{ entry.id }}">
    <form hx-post="{% url 'edit_entry' entry.pk %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML"
        class="bg-white p-5 sm:p-6 rounded border border-black focus-within:border-black focus-within:ring-[3px] focus-within:ring-[#3f3f46]">
        {% csrf_token %}

        <textarea name="body"
            class="w-full bg-transparent text-black focus:ring-0 border-0 outline-none resize-y p-0 mb-2" rows="3"
            required>{{ entry.body }}</textarea>

        <div class="flex items-center gap-2 border-t border-black/20 pt-3 mt-1">
            <span class="text-sm font-semibold text-black/65 pt-0.5">Label:</span>
            <div class="flex-1">
                {{ entry_form.label_name }}
            </div>
        </div>

        <div class="flex justify-end gap-4 mt-4">
            <button type="button" hx-get="{% url 'get_entry' entry.pk %}" hx-target="#entry-{{ entry.id }}"
                hx-swap="outerHTML" class="text-xs font-black text-black/65 hover:text-black tracking-tight">
                Cancel
            </button>

            <button type="submit" class="rounded-none bg-black px-4 py-2 text-xs font-semibold text-white hover:bg-[#3f3f46]">
                Save Changes
            </button>
        </div>
    </form>
</div>

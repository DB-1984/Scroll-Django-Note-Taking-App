<div class="rounded-2xl border border-black/10 p-5 transition-colors duration-500
    {% if temp != '--' and temp > 25 %}bg-[#fff4e5]
    {% elif 'Rain' in condition or 'Drizzle' in condition or 'Showers' in condition %}bg-[#eaf6f4]
    {% elif temp != '--' and temp < 8 %}bg-[#eef6ff]
    {% else %}bg-white{% endif %}">
    <p class="mb-3 text-[13px] font-medium text-[#999]">
        {% if is_local %}Local weather{% else %}Banbury weather{% endif %}
    </p>
    <div class="flex items-end justify-between gap-4">
        <span class="text-4xl font-semibold tracking-tight leading-none text-black">
            {{ temp }}{% if temp != '--' %}°C{% endif %}
        </span>
        <span class="max-w-32 text-right text-[15px] text-[#555]">{{ condition }}</span>
    </div>
</div>

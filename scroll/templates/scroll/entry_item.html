<div id="entry-{{ entry.id }}" class="flex gap-3 px-4 sm:px-6 py-4 border-b border-black/10 last:border-b-0">

    <div class="size-9 rounded-full bg-black flex-shrink-0 flex items-center justify-center text-xs font-semibold text-white">
        {{ entry.user.username|slice:":1"|upper }}
    </div>

    <div class="flex-grow min-w-0">
        <div class="flex items-baseline gap-2">
            <span class="text-[15px] font-semibold text-black">{{ entry.user.username }}</span>
            <span class="text-[15px] text-[#999]" title="{{ entry.created_at|date:'M j, Y H:i' }}">
                {{ entry.created_at|date:"M j" }}
            </span>
        </div>

        <p class="mt-0.5 text-[15px] leading-[1.45] text-black whitespace-pre-wrap break-words">{{ entry.body }}</p>

        {% if entry.label %}
        <a href="{% url 'index' %}?q={{ entry.label.name }}"
            class="inline-block mt-2 text-[13px] text-[#555] bg-[#f3f5f7] px-3 py-1 rounded-full hover:bg-[#e8ebee] transition-colors">
            #{{ entry.label.name }}
        </a>
        {% endif %}

        <div class="mt-3 -ml-2 flex flex-wrap items-center gap-1 text-[#999]">
            <button hx-get="{% url 'edit_entry' entry.id %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML"
                title="Edit" class="p-2 rounded-full hover:bg-black/5 hover:text-black transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                    <path d="m15 5 4 4" />
                </svg>
            </button>

            <button hx-delete="{% url 'delete_entry' entry.id %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML"
                hx-confirm="Delete this entry?" title="Delete"
                class="p-2 rounded-full hover:bg-black/5 hover:text-[#ff3040] transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18" />
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                </svg>
            </button>

            <form hx-post="{% url 'share_entry' entry.id %}" hx-target="#share-status-{{ entry.id }}"
                hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.reset()"
                class="flex items-center">
                {% csrf_token %}
                <input type="email" name="email" placeholder="Share via email"
                    class="bg-transparent border-0 text-[13px] text-black outline-none p-1 w-24 focus:w-40 transition-all placeholder:text-[#999]">
                <button type="submit" title="Share"
                    class="p-2 rounded-full hover:bg-black/5 hover:text-black transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m22 2-7 20-4-9-9-4Z" />
                        <path d="M22 2 11 13" />
                    </svg>
                </button>
            </form>
            <span id="share-status-{{ entry.id }}" class="text-[13px] text-[#555]"></span>
        </div>
    </div>
</div>

{% extends "scroll/base.html" %}

{% block content %}
<div class="py-3 text-center text-[15px] font-semibold border-b border-black/10">Labels</div>

<div class="divide-y divide-black/10">
    {% for label in labels %}
    <a href="{% url 'index' %}?q={{ label.name }}"
        class="group flex justify-between items-center px-4 sm:px-6 py-4 hover:bg-[#fafafa] transition-colors">
        <span class="text-[15px] font-semibold text-black">#{{ label.name }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="text-[#b0b0b0] group-hover:text-black transition-colors">
            <path d="m9 18 6-6-6-6" />
        </svg>
    </a>
    {% empty %}
    <div class="p-12 text-center">
        <p class="text-[15px] text-[#999]">No labels yet.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}

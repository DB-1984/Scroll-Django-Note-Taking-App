{% extends "scroll/base.html" %}

{% block page_title %}Labels{% endblock %}

{% block content %}
<ul class="m-0 list-none p-0">
  {% for label in labels %}
  <li class="border-b border-line first:pt-0 last:border-b-0">
    <a href="{% url 'index' %}?q={{ label.name }}"
      class="group flex items-center justify-between py-5 text-[26px] font-light tracking-[-.02em] text-ink no-underline">
      <span class="group-hover:underline group-hover:underline-offset-4">#{{ label.name }}</span>
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </a>
  </li>
  {% empty %}
  <li class="py-10 text-[22px] font-light text-muted">No labels yet.</li>
  {% endfor %}
</ul>
{% endblock %}

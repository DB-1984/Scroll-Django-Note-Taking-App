{% extends "scroll/base.html" %}

{% block page_title %}Labels{% endblock %}

{% block content %}
<ul class="m-0 flex list-none flex-col gap-3 p-0">
  {% for label in labels %}
  <li>
    <a href="{% url 'index' %}?q={{ label.name }}"
      class="flex items-center justify-between border border-ink px-4 py-3.5 text-ink no-underline hover:bg-ink hover:text-paper">
      <span class="lb">#{{ label.name }}</span>
      <svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </a>
  </li>
  {% empty %}
  <li class="border border-ink px-4 py-10 text-center text-[15px] text-muted">No labels yet.</li>
  {% endfor %}
</ul>
{% endblock %}

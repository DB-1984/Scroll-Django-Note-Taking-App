{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    input:not([type="checkbox"]):not([type="submit"]),
    select,
    textarea {
      width: 100%;
      background: #f3f5f7;
      color: #000;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: .75rem 1rem;
      font-size: 15px;
      outline: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: #999;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(0, 0, 0, .25);
      background: #fff;
    }

    button[type="submit"],
    input[type="submit"] {
      width: 100%;
      background: #000;
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: .75rem 1.25rem;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"]:hover,
    input[type="submit"]:hover {
      background: rgba(0, 0, 0, .8);
    }

    a {
      color: #000;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>

<body class="min-h-screen bg-[#f3f5f7] text-black antialiased selection:bg-black selection:text-white">

  <div class="flex flex-col items-center justify-center min-h-screen p-6 md:p-12">

    <div class="w-full max-w-[420px] bg-white text-black border border-black/10 p-8 md:p-10 space-y-6 rounded-3xl">
      <div class="flex justify-center">
        <a href="{% url 'index' %}" class="inline-flex items-center gap-2 text-black text-2xl font-bold tracking-tight">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="14 45 341 281" fill="currentColor" class="h-[1em] w-auto" aria-hidden="true">
            <path fill-rule="evenodd" d="M14 157V104A58 58 0 0 1 72 46H235A58 58 0 0 1 293 104V217H138V284A42 42 0 0 1 96 326H84V157ZM44 126V100A23 23 0 0 1 67 77H84V126Z" />
            <path d="M168 246H355V276A50 50 0 0 1 305 326H155C164 305 168 280 168 246Z" />
          </svg>
          <span><p class="tracking-tight font-black text-base">Scroll</p></span>
        </a>
      </div>
      <p class="text-center text-[15px] text-[#555]">
        Capture, tag, and search ideas.
      </p>

      {% block content %}{% endblock %}

    </div>

  </div>

</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll</title>
  <script>
    // Apply saved theme (or the OS preference) before first paint
    (function () {
      try {
        var t = localStorage.getItem('scroll-theme');
        var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', d);
      } catch (e) { }
    })();
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: 'var(--bg)', void: 'var(--void)', ink: 'var(--ink)', muted: 'var(--muted)', dim: 'var(--dim)',
            line: 'var(--line)', field: 'var(--field)', btn: 'var(--btn)', 'btn-ink': 'var(--btn-ink)', err: 'var(--err)'
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#3fd7bc; --void:#02070d; --ink:#04090f; --muted:#15493f; --dim:#1f6a5e; --line:rgba(4,9,15,.28); --field:rgba(255,255,255,.22); --btn:#04090f; --btn-ink:#3fd7bc; --err:#7a0f1a; }
    .dark { --bg:#07151a; --void:#000; --ink:#e7fff9; --muted:#8fc9bd; --dim:#5fa396; --line:rgba(231,255,249,.22); --field:rgba(231,255,249,.06); --btn:#3fd7bc; --btn-ink:#04090f; --err:#ff9a8a; }
    html { color-scheme: light; }
    html.dark { color-scheme: dark; }
    body { font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--void); }

    svg.ic { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .i-sun { display: none; }
    .dark .i-sun { display: block; }
    .dark .i-moon { display: none; }
    .lb { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }

    .btn, .btn-o { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 54px; padding: 0 30px; border-radius: 9999px;
         font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .btn { background: var(--btn); color: var(--btn-ink); border: 1px solid var(--btn); }
    .btn:hover { opacity: .85; }
    .btn-o { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
    .btn-o:hover { background: var(--ink); color: var(--bg); }

    /* Form controls (also styles allauth's unclassed form.as_p fields) */
    input:not([type="checkbox"]):not([type="submit"]):not([type="hidden"]), select, textarea {
      width: 100%; box-sizing: border-box; background: transparent; color: var(--ink);
      border: 1px solid var(--ink); border-radius: 9999px; padding: 15px 24px; font: inherit; font-size: 15px; outline: 0;
    }
    textarea { border-radius: 24px; }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    input:focus, select:focus, textarea:focus { background: var(--field); box-shadow: 0 0 0 1px var(--ink); }
    input[aria-invalid="true"] { border-color: var(--err); box-shadow: 0 0 0 1px var(--err); }
    input[type="checkbox"] { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
    a { color: var(--ink); }
  </style>
</head>

<body class="min-h-screen bg-void text-ink antialiased">
  <div class="min-h-screen lg:p-7">
    <div class="relative grid min-h-screen overflow-clip bg-mint text-ink lg:min-h-[calc(100vh-3.5rem)] lg:grid-cols-[minmax(300px,34%)_1fr] lg:rounded-[10px] lg:rounded-br-[44px]">

      <button type="button" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme"
        class="absolute right-6 top-6 z-10 grid size-10 place-items-center rounded-full border border-ink bg-transparent text-ink hover:bg-ink hover:text-mint lg:right-10 lg:top-9">
        <svg class="ic i-moon" width="16" height="16" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
        <svg class="ic i-sun" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
      </button>

      <aside class="border-b border-line px-6 pb-10 pt-7 lg:border-b-0 lg:border-r lg:px-10 lg:py-9">
        <a href="/" class="inline-flex items-center gap-2.5 text-ink no-underline">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="14 45 341 281" fill="currentColor" class="h-[22px] w-auto" aria-hidden="true">
            <path fill-rule="evenodd" d="M14 157V104A58 58 0 0 1 72 46H235A58 58 0 0 1 293 104V217H138V284A42 42 0 0 1 96 326H84V157ZM44 126V100A23 23 0 0 1 67 77H84V126Z" />
            <path d="M168 246H355V276A50 50 0 0 1 305 326H155C164 305 168 280 168 246Z" />
          </svg>
          <span class="text-[15px] font-light tracking-[-.01em]">Scroll</span>
        </a>
        <p class="mt-10 max-w-[12ch] text-[34px] font-light leading-[1.1] tracking-[-.025em] lg:mt-24">Capture, tag, and search ideas.</p>
      </aside>

      <main class="flex flex-col justify-center px-6 pb-14 pt-10 lg:px-10 lg:py-16">
        <div class="flex w-full max-w-[420px] flex-col gap-5">
          {% block content %}{% endblock %}
        </div>
      </main>

    </div>
  </div>

  <script>
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('scroll-theme', isDark ? 'dark' : 'light'); } catch (e) { }
    }
  </script>
</body>

</html>

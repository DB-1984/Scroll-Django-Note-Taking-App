{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@1,900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .serif-italic {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 900;
    }
    input, select, textarea { background: #fff; color: #111; border: 1px solid #111; border-radius: 4px; }
    input::placeholder, textarea::placeholder { color: #666; }
    input:focus, select:focus, textarea:focus { outline: 3px solid #3f3f46; }
    button[type="submit"], input[type="submit"] { background: #000; color: #fff; border: 0; padding: .65rem 1.25rem; font-weight: 700; }
    a { color: #3f3f46; }
  </style>
</head>

<body
  class="min-h-screen bg-[#dedbd8] text-black antialiased selection:bg-zinc-900 selection:text-white">

  <div class="flex flex-col items-center justify-center min-h-screen p-6 md:p-12 space-y-4">

    <div
      class="w-full max-w-[450px] bg-white text-black border border-black p-8 md:p-10 space-y-6 rounded shadow-[6px_6px_0_#000]">
      <div class="flex items-baseline gap-4 justify-center">
        <h1 class="text-4xl font-black uppercase tracking-[-0.05em]">
          Scroll
        </h1>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#3f3f46"
          class="w-6 h-6 text-zinc-400 animate-pulse transition-transform duration-500 transform-gpu">
          <path
            d="M2 4a2 2 0 0 1 2-2h8a2 2 0 1 1 0 4H4a2 2 0 0 1-2-2ZM2 9.25a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 9.25ZM2.75 12.5a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Z" />
        </svg>
      </div>
      <p class="text-center text-sm text-black/65 tracking-tight">
        Capture, tag, and search ideas...
      </p>

      {% block content %}{% endblock %}

    </div>


  </div>

</body>

</html>

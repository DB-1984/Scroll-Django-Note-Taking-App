{% extends "scroll/base_entrance.html" %}
{% block content %}
<div class="space-y-5">
  <span aria-hidden="true" class="inline-flex size-12 items-center justify-center rounded border border-black bg-[#ffcb24] text-xl shadow-[3px_3px_0_#000]">✉</span>
  <h2 class="text-2xl font-black tracking-tight">Check your inbox</h2>
  <p class="text-sm leading-6 text-black/70">If there's an account for that email, you'll receive a password reset link. Check your spam folder too.</p>
  <a href="{% url 'account_login' %}" class="inline-block rounded border border-black bg-black px-5 py-3 text-sm font-bold text-white shadow-[3px_3px_0_#3f3f46]">Return to sign in</a>
</div>
{% endblock %}

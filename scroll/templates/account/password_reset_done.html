{% extends "scroll/base_entrance.html" %}
{% block content %}
<span aria-hidden="true" class="grid size-12 place-items-center rounded-full border border-ink text-xl">✉</span>
<div>
  <h2 class="m-0 text-2xl font-semibold tracking-tight">Check your inbox</h2>
  <p class="mt-2 text-sm leading-6 text-muted">If there's an account for that email, you'll receive a password reset link. Check your spam folder too.</p>
</div>
<a href="{% url 'account_login' %}" class="lb bg-ink px-5 py-3 text-center text-paper no-underline hover:opacity-85">Return to sign in</a>
{% endblock %}
